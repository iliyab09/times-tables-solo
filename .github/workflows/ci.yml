name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No conflict markers
        run: "! git grep -nE '^(<<<<<<<|>>>>>>>)( |$)'"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test
